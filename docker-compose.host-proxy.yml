# Isolated production candidate for the existing host Caddy.
# It deliberately avoids publishing 80/443 or joining any shared Docker network.
services:
  web:
    ports:
      - "127.0.0.1:18002:8000"
    extra_hosts:
      # This Mac maps public SatoshiCore domains to 127.0.0.1 in /etc/hosts.
      # Inside a container, loopback points at the container, not host Caddy.
      # Keep the original HTTPS hostname/SNI but route its TCP connection to
      # Docker's host-gateway so the backend can reach the local TLS proxy.
      - "gateway.satoshicore.org:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      MHTALK_SERVE_MEDIA: "True"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media

  db:
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    name: nsat-mhtalk-prod-postgres
  redis_data:
    name: nsat-mhtalk-prod-redis
  media:
    name: nsat-mhtalk-prod-media
